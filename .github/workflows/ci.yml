name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  evals:
    name: Golden-set evals (regression gate)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$GCP_SA_KEY" ] && { [ -n "$OPENROUTER_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Evals skipped: set GCP_SA_KEY and OPENROUTER_API_KEY or GEMINI_API_KEY repository secrets to enable the quality gate."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: google-github-actions/auth@v2
        if: steps.secrets.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Run evals and gate on regression
        if: steps.secrets.outputs.ok == 'true'
        run: |
          pip install -r requirements.txt
          python -m evals.run --gate
      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.ok == 'true'
        with:
          name: eval-results
          path: evals/results/latest.json
